# Cloudflare Pages 构建配置
#
# 说明：
# [build] 段Cloudflare Pages 会读取，用来确定构建命令和输出目录。
# [build.environment] 段 Pages 不会读取（那是 Wrangler 的语法），
# 但 build.py 会解析本文件作为域名兜底，所以SITE_DOMAIN 仍写在这里。

name = "linwt"
compatibility_date = "2026-10-06"

[build]
command = "python3 build.py --build"
publish = "dist"

[vars]
SITE_DOMAIN = "linwt.top"